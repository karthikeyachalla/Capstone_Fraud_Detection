version: '3.8'

services:
  # 1. Multi-Agent FastAPI Gateway
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_gateway_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Financial Risk Intelligence Dashboard
  dashboard:
    image: python:3.11-alpine
    container_name: fraud_gateway_dashboard
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app:/app
    command: python -m http.server 3000 --directory /app
    ports:
      - "3000:3000"
    depends_on:
      - api
